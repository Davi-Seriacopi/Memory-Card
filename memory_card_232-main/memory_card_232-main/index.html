<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>     

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="spider_man">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/avengers.png" alt="avengers" />
      <img class="back-face" src="img/spider_man.png" alt="Spider Man" />
    </section>

    <section class="memory-card" data-framework="black_panther">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/black_panther.png" alt="Black Panther" />
    </section>

    <section class="memory-card" data-framework="captain_america">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/captain_america.png" alt="Captain America" />
    </section>

    <section class="memory-card" data-framework="iron_man">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/iron_man.png" alt="Iron Man" />
    </section>

    <section class="memory-card" data-framework="deadpool">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/deadpool.png" alt="DeadPool Man" />
    </section>

    <section class="memory-card" data-framework="wolverine">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/wolverine.png" alt="Wolverine" />
    </section>

    <section class="memory-card" data-framework="wolverine">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/wolverine.png" alt="Wolverine" />
    </section>

    <section class="memory-card" data-framework="captain_america">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/captain_america.png" alt="Captain America" />
    </section>

    <section class="memory-card" data-framework="iron_man">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/iron_man.png" alt="Iron Man" />
    </section>

    <section class="memory-card" data-framework="black_panther">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/black_panther.png" alt="Black Panther" />
    </section>

    <section class="memory-card" data-framework="deadpool">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/deadpool.png" alt="DeadPool" />
    </section>

    <section class="memory-card" data-framework="spider_man">
      <img class="front-face" src="img/avengers.png" alt="Avengers" />
      <img class="back-face" src="img/spider_man.png" alt="Spider man" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/script.js"></script>
</body>
</html>
